# AIRL after simple pretrain (RL/learning.md Simple).
seed: 2
device: auto

airl:
  expert_path: ./RL/train_scripts/expert/simple/expert_data.pkl
  pretrain_path: ./RL/train_scripts/checkpoints/simple/pretrain/bc_pretrain.zip
  min_expert_episodes: 10
  rounds: 20
  steps_per_round: 8000
  demo_batch_size: 256
  gen_replay_buffer_capacity: 1024
  gen_train_timesteps: 300
  n_disc_updates_per_round: 2
  disc_lr: 0.0001
  gen_lr: 0.0001
  log_std_boost: 0.0
  reward_dir: ./RL/train_scripts/checkpoints/simple/airl/reward
  policy_dir: ./RL/train_scripts/checkpoints/simple/airl/policy

policy:
  policy_type: custom
  features_dim: 96
  log_std_init: -2.7

vec_env:
  n_envs: 1
  gui: false

logging:
  tensorboard_dir: ./RL/train_scripts/logs/simple/airl/
