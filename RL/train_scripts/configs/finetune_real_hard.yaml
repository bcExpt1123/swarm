# PPO fine-tune: real hard (validator-scale). Matches RL/learning.md Real Hard ppo_train.
seed: 42
total_timesteps: 15000000
device: auto
resume_path: ./RL/train_scripts/checkpoints/real_hard/airl/policy/ppo_policy_60.zip

reward:
  use_env_reward: true
  env_reward_scale: 1.0
  goal_progress: 0
  collision: 0
  obstacle_proximity: 0
  hover_stability: 0
  smooth_action: 0
  angular_velocity: 0
  alive: 0
  energy: 0

curriculum:
  enabled: true
  auto_advance: true
  stages:
    - name: mixed
      challenge_types: [1, 2, 3, 4, 5, 6]
      min_success_rate: 0.20
      min_episodes: 80
      eval_episodes: 30
      moving_platform_prob: 0.15
    - name: validator_mix
      challenge_types: [3, 4, 5, 6]
      min_success_rate: 0.28
      min_episodes: 100
      eval_episodes: 40
      moving_platform_prob: 0.25

ppo:
  learning_rate: 0.0001
  lr_end: 0.00001
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.08
  clip_range_vf: 0.1
  ent_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 0.2
  n_steps: 4096
  batch_size: 2048
  n_epochs: 5

policy:
  policy_type: custom
  features_dim: 96
  log_std_init: -1.8

vec_env:
  n_envs: 8
  subproc: false
  norm_obs: false
  norm_reward: false
  clip_obs: 10.0

logging:
  tensorboard_dir: ./RL/train_scripts/logs/real_hard/finetune/
  tensorboard_write_events: true
  wandb_enabled: false
  wandb_project: swarm-drone-rl
  wandb_run_name: finetune_real_hard

checkpoint:
  dir: ./RL/train_scripts/checkpoints/real_hard/finetune/
  freq: 1000000
  submission_output: ppo_policy

evaluation:
  eval_freq: 500000
  n_episodes: 40
