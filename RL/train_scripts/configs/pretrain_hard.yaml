# Hard: full 3D control / harder maps. Matches RL/learning.md "Hard".
seed: 2
total_timesteps: 1500000
device: auto

reward:
  use_env_reward: true
  env_reward_scale: 1.0
  goal_progress: 0
  collision: 0
  obstacle_proximity: 0
  hover_stability: 0
  smooth_action: 0
  angular_velocity: 0
  alive: 0
  energy: 0

curriculum:
  enabled: true
  auto_advance: true
  randomize_env_params: true
  stages:
    - name: type1_2
      challenge_types: [1, 2]
      min_success_rate: 0.18
      min_episodes: 50
      eval_episodes: 15
      moving_platform_prob: 0.05
    - name: type3_4
      challenge_types: [3, 4]
      min_success_rate: 0.20
      min_episodes: 60
      eval_episodes: 20
      moving_platform_prob: 0.10

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: 0.1
  ent_coef: 0.005
  vf_coef: 0.15
  max_grad_norm: 0.3
  n_steps: 2048
  batch_size: 1024
  n_epochs: 10

policy:
  policy_type: custom
  features_dim: 96
  log_std_init: -1.8

vec_env:
  n_envs: 8
  subproc: false
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0

logging:
  tensorboard_dir: ./RL/train_scripts/logs/hard/pretrain/
  tensorboard_write_events: true
  wandb_enabled: false
  wandb_project: swarm-drone-rl
  wandb_run_name: pretrain_hard

checkpoint:
  dir: ./RL/train_scripts/checkpoints/hard/pretrain/
  freq: 500000
  submission_output: ppo_policy

evaluation:
  eval_freq: 150000
  n_episodes: 20

bc:
  collect_episodes: 150
  max_steps_per_episode: 4096
  train_steps: 200
  bc_lr: 0.0001
  batch_size: 1024
