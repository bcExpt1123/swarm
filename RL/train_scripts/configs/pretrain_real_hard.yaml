# Real hard: validator-scale difficulty. Matches RL/learning.md "Real Hard".
seed: 42
total_timesteps: 2000000
device: auto

reward:
  use_env_reward: true
  env_reward_scale: 1.0
  goal_progress: 0
  collision: 0
  obstacle_proximity: 0
  hover_stability: 0
  smooth_action: 0
  angular_velocity: 0
  alive: 0
  energy: 0

curriculum:
  enabled: true
  auto_advance: true
  randomize_env_params: true
  stages:
    - name: mixed_early
      challenge_types: [1, 2, 3]
      min_success_rate: 0.15
      min_episodes: 60
      eval_episodes: 20
      moving_platform_prob: 0.10
    - name: mixed_full
      challenge_types: [1, 2, 3, 4, 5, 6]
      min_success_rate: 0.22
      min_episodes: 80
      eval_episodes: 25
      moving_platform_prob: 0.20

ppo:
  learning_rate: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: 0.1
  ent_coef: 0.01
  vf_coef: 0.15
  max_grad_norm: 0.3
  n_steps: 4096
  batch_size: 1024
  n_epochs: 10

policy:
  policy_type: custom
  features_dim: 96
  log_std_init: -1.8

vec_env:
  n_envs: 8
  subproc: false
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0

logging:
  tensorboard_dir: ./RL/train_scripts/logs/real_hard/pretrain/
  tensorboard_write_events: true
  wandb_enabled: false
  wandb_project: swarm-drone-rl
  wandb_run_name: pretrain_real_hard

checkpoint:
  dir: ./RL/train_scripts/checkpoints/real_hard/pretrain/
  freq: 500000
  submission_output: ppo_policy

evaluation:
  eval_freq: 200000
  n_episodes: 25

bc:
  collect_episodes: 250
  max_steps_per_episode: 4096
  train_steps: 300
  bc_lr: 0.0001
  batch_size: 1024
